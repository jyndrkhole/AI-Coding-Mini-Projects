[browser]
gatherUsageStats = false

[server]
headless = true

[theme]
base = "light"
primaryColor = "#0F6B5C"
backgroundColor = "#F3F0E8"
secondaryBackgroundColor = "#FFFcf7"
textColor = "#1C2B27"
linkColor = "#0F6B5C"
borderColor = "#E2D9CC"
dataframeHeaderBackgroundColor = "#E7F2EE"
baseRadius = "0.7rem"
buttonRadius = "0.55rem"
showWidgetBorder = true
showSidebarBorder = true
font = "Source Sans 3:https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&display=swap"
headingFontSizes = ["2.4rem", "1.55rem", "1.25rem", "1.05rem", "0.95rem", "0.85rem"]

[theme.sidebar]
backgroundColor = "#E7EFEA"
secondaryBackgroundColor = "#F7FBF9"
borderColor = "#D5E3DC"
