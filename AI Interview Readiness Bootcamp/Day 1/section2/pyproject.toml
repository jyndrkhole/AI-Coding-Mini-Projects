[project]
name = "fws-section-02-first-agent"
version = "1.0.0"
description = "Future with Shivank — AI Harness · Section 2: your first LangChain agent — tools, Tavily web search, structured output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4",
    "langchain-core>=1.4",
    "langchain-openai>=1.7",
    "langchain-tavily>=0.2.18",
    "tavily-python>=0.7.12",
    "pydantic>=2.11",
    "python-dotenv>=1.1",
]

[dependency-groups]
dev = [
    "black>=25.1",
    "isort>=6.0",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
